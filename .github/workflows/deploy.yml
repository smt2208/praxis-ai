name: Deploy to EC2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to Project Folder
        run: |
          echo "📂 Syncing code to ~/praxis-ai..."
          mkdir -p ~/praxis-ai
          rsync -av --delete --exclude='.git' --exclude='.env' --exclude='actions-runner/' --exclude='frontend/' ./ ~/praxis-ai/

      - name: Run Deployment Script
        run: |
          echo "🚀 Starting deployment from ~/praxis-ai..."
          cd ~/praxis-ai
          sed -i 's/\r//' deploy.sh
          chmod +x deploy.sh
          bash deploy.sh
